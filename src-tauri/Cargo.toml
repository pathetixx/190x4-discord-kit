[package]
name = "discord-kit"
version = "0.1.0"
description = "190x4 Discord Kit — BetterDiscord + 190x4 theme and plugins in one click"
authors = ["pathetixx"]
edition = "2021"
license = "MIT"

[lib]
name = "discord_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
sha2 = "0.10"
hex = "0.4"
winreg = "0.55"
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
